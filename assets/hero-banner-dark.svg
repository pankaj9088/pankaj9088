<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orb-blue" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-purple" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-cyan" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.15;
      stroke-width: 1;
    }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    .cursor {
      animation: blink 1s infinite;
      fill: #a78bfa;
    }
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.4; transform: scale(1); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad-dark)" />

  <!-- Background Orbs -->
  <rect width="1200" height="320" rx="16" fill="url(#orb-blue)" />
  <rect width="1200" height="320" rx="16" fill="url(#orb-purple)" />
  <rect width="1200" height="320" rx="16" fill="url(#orb-cyan)" />

  <!-- Grid Lines Overlay -->
  <path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240" class="grid-line" />
  <path d="M 200,0 L 200,320 M 400,0 L 400,320 M 600,0 L 600,320 M 800,0 L 800,320 M 1000,0 L 1000,320" class="grid-line" />

  <!-- Outer Border -->
  <rect x="1.5" y="1.5" width="1197" height="317" rx="14.5" fill="none" stroke="url(#border-grad)" stroke-width="2" stroke-opacity="0.8" />

  <!-- Content Container -->
  <!-- Top Greeting & Online Status -->
  <g transform="translate(60, 65)">
    <circle cx="10" cy="10" r="6" fill="#10b981" class="pulse-dot" />
    <circle cx="10" cy="10" r="10" fill="#10b981" opacity="0.25" class="pulse-dot" />
    <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="15" font-weight="600" fill="#34d399" letter-spacing="1.5">AVAILABLE FOR OPPORTUNITIES</text>
  </g>

  <!-- Main Animated Heading -->
  <g transform="translate(60, 130)">
    <text class="title">Hi, I'm a Full Stack Engineer &amp; Creator <tspan class="cursor">|</tspan></text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(60, 175)">
    <text class="subtitle">Building scalable web apps, high-performance systems &amp; elegant open-source software 🚀</text>
  </g>

  <!-- Badges / Tags -->
  <g transform="translate(60, 220)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="38" rx="19" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
      <text x="20" y="24" class="badge-text">⚡ Web Development</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(185, 0)">
      <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1" />
      <text x="20" y="24" class="badge-text">🤖 AI &amp; Cloud Systems</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(380, 0)">
      <rect width="190" height="38" rx="19" fill="#1e293b" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1" />
      <text x="20" y="24" class="badge-text">🌟 Open Source Crafts</text>
    </g>
  </g>

  <!-- Decorative Right-side Code Icon Graphics -->
  <g transform="translate(980, 100)" opacity="0.85">
    <rect x="-10" y="-10" width="160" height="130" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="15" cy="12" r="5" fill="#ef4444" />
    <circle cx="32" cy="12" r="5" fill="#f59e0b" />
    <circle cx="49" cy="12" r="5" fill="#10b981" />
    <path d="M 0,30 L 140,30" stroke="#1e293b" stroke-width="1.5" />
    <text x="15" y="55" font-family="Courier, monospace" font-size="13" fill="#60a5fa">&lt;code&gt;</text>
    <text x="30" y="77" font-family="Courier, monospace" font-size="13" fill="#a78bfa">build(awesome);</text>
    <text x="15" y="99" font-family="Courier, monospace" font-size="13" fill="#60a5fa">&lt;/code&gt;</text>
  </g>
</svg>
