<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="proj-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="card-border-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="card-border-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="card-border-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <style>
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 24px; fill: #f8fafc; }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 14px; fill: #94a3b8; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 18px; fill: #ffffff; }
    .card-desc { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 13px; fill: #cbd5e1; }
    .tag-text { font-family: monospace; font-size: 11px; fill: #38bdf8; }
    .badge-label { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #38bdf8; }
  </style>

  <!-- Container -->
  <rect width="1200" height="420" rx="16" fill="url(#proj-bg-dark)" stroke="#1e293b" stroke-width="2" />

  <!-- Section Header -->
  <g transform="translate(50, 45)">
    <text class="title-text">⚡ Featured Projects</text>
    <text y="25" class="subtitle-text">Pankaj's highlighted web applications and open-source repositories</text>
  </g>

  <!-- Project Cards Grid -->
  <!-- Card 1: ChatGo -->
  <g transform="translate(50, 110)">
    <rect width="340" height="260" rx="12" fill="#131c2e" stroke="url(#card-border-1)" stroke-width="1.5" />
    <!-- Icon Container -->
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#1e3a8a" />
    <text x="31" y="46" font-family="sans-serif" font-size="20" fill="#60a5fa">💬</text>
    <text x="270" y="42" class="badge-label">Real-Time</text>
    
    <text x="20" y="90" class="card-title">ChatGo</text>
    <text x="20" y="115" class="card-desc">Real-time chat application featuring instant messaging, live channels, and active user presence.</text>

    <g transform="translate(20, 185)">
      <rect width="60" height="24" rx="12" fill="#0f2942" />
      <text x="12" y="16" class="tag-text">React</text>
      <rect x="70" width="70" height="24" rx="12" fill="#0f2942" />
      <text x="80" y="16" class="tag-text">Node.js</text>
      <rect x="150" width="80" height="24" rx="12" fill="#0f2942" />
      <text x="160" y="16" class="tag-text">Socket.io</text>
    </g>
  </g>

  <!-- Card 2: Chess -->
  <g transform="translate(430, 110)">
    <rect width="340" height="260" rx="12" fill="#18152e" stroke="url(#card-border-2)" stroke-width="1.5" />
    <!-- Icon Container -->
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#311b92" />
    <text x="31" y="46" font-family="sans-serif" font-size="20" fill="#a78bfa">♟️</text>
    <text x="290" y="42" class="badge-label" fill="#c084fc">Game</text>
    
    <text x="20" y="90" class="card-title">Chess Engine</text>
    <text x="20" y="115" class="card-desc">Interactive web-based chess application supporting move tracking, board highlights, and game logic.</text>

    <g transform="translate(20, 185)">
      <rect width="85" height="24" rx="12" fill="#241442" />
      <text x="11" y="16" class="tag-text" fill="#c084fc">JavaScript</text>
      <rect x="95" width="60" height="24" rx="12" fill="#241442" />
      <text x="106" y="16" class="tag-text" fill="#c084fc">HTML5</text>
      <rect x="165" width="55" height="24" rx="12" fill="#241442" />
      <text x="176" y="16" class="tag-text" fill="#c084fc">CSS3</text>
    </g>
  </g>

  <!-- Card 3: LifeOS -->
  <g transform="translate(810, 110)">
    <rect width="340" height="260" rx="12" fill="#102322" stroke="url(#card-border-3)" stroke-width="1.5" />
    <!-- Icon Container -->
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#064e3b" />
    <text x="31" y="46" font-family="sans-serif" font-size="20" fill="#34d399">⚡</text>
    <text x="250" y="42" class="badge-label" fill="#34d399">Productivity</text>
    
    <text x="20" y="90" class="card-title">LifeOS Dashboard</text>
    <text x="20" y="115" class="card-desc">Personal productivity dashboard for managing daily tasks, goal tracking, habits, and workflow stats.</text>

    <g transform="translate(20, 185)">
      <rect width="80" height="24" rx="12" fill="#09382e" />
      <text x="11" y="16" class="tag-text" fill="#4ade80">TypeScript</text>
      <rect x="90" width="60" height="24" rx="12" fill="#09382e" />
      <text x="102" y="16" class="tag-text" fill="#4ade80">React</text>
      <rect x="160" width="70" height="24" rx="12" fill="#09382e" />
      <text x="171" y="16" class="tag-text" fill="#4ade80">Tailwind</text>
    </g>
  </g>
</svg>
