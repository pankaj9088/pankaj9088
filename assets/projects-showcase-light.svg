<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="proj-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="card-border-1-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="card-border-2-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="card-border-3-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <style>
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 24px; fill: #0f172a; }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 14px; fill: #64748b; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 18px; fill: #0f172a; }
    .card-desc { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 13px; fill: #334155; }
    .tag-text { font-family: monospace; font-size: 11px; fill: #0284c7; }
    .star-count { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #d97706; }
  </style>

  <!-- Container -->
  <rect width="1200" height="420" rx="16" fill="url(#proj-bg-light)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Section Header -->
  <g transform="translate(50, 45)">
    <text class="title-text">⚡ Featured Open-Source Projects</text>
    <text y="25" class="subtitle-text">Selected high-impact applications, libraries, and frameworks</text>
  </g>

  <!-- Project Cards Grid -->
  <!-- Card 1 -->
  <g transform="translate(50, 110)">
    <rect width="340" height="260" rx="12" fill="#ffffff" stroke="url(#card-border-1-l)" stroke-width="1.5" />
    <!-- Top bar -->
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#dbeafe" />
    <text x="33" y="45" font-family="sans-serif" font-size="20" fill="#1d4ed8">🤖</text>
    <text x="280" y="40" class="star-count">★ 1.2k</text>
    
    <text x="20" y="90" class="card-title">AI Assistant Hub</text>
    <text x="20" y="115" class="card-desc">An intelligent autonomous AI workspace agent with multi-modal capabilities and tool execution.</text>

    <g transform="translate(20, 185)">
      <rect width="80" height="24" rx="12" fill="#e0f2fe" />
      <text x="12" y="16" class="tag-text">TypeScript</text>
      <rect x="90" width="70" height="24" rx="12" fill="#e0f2fe" />
      <text x="102" y="16" class="tag-text">Next.js</text>
      <rect x="170" width="70" height="24" rx="12" fill="#e0f2fe" />
      <text x="182" y="16" class="tag-text">OpenAI</text>
    </g>
  </g>

  <!-- Card 2 -->
  <g transform="translate(430, 110)">
    <rect width="340" height="260" rx="12" fill="#ffffff" stroke="url(#card-border-2-l)" stroke-width="1.5" />
    <!-- Top bar -->
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#ede9fe" />
    <text x="33" y="45" font-family="sans-serif" font-size="20" fill="#6d28d9">🚀</text>
    <text x="280" y="40" class="star-count">★ 850</text>
    
    <text x="20" y="90" class="card-title">Cloud Microservices</text>
    <text x="20" y="115" class="card-desc">Ultra-fast event-driven architecture template built for micro-latency streaming &amp; scalable web services.</text>

    <g transform="translate(20, 185)">
      <rect width="60" height="24" rx="12" fill="#f3e8ff" />
      <text x="14" y="16" class="tag-text" fill="#7e22ce">Go</text>
      <rect x="70" width="70" height="24" rx="12" fill="#f3e8ff" />
      <text x="80" y="16" class="tag-text" fill="#7e22ce">Docker</text>
      <rect x="150" width="70" height="24" rx="12" fill="#f3e8ff" />
      <text x="162" y="16" class="tag-text" fill="#7e22ce">Redis</text>
    </g>
  </g>

  <!-- Card 3 -->
  <g transform="translate(810, 110)">
    <rect width="340" height="260" rx="12" fill="#ffffff" stroke="url(#card-border-3-l)" stroke-width="1.5" />
    <!-- Top bar -->
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#d1fae5" />
    <text x="33" y="45" font-family="sans-serif" font-size="20" fill="#047857">🎨</text>
    <text x="280" y="40" class="star-count">★ 2.4k</text>
    
    <text x="20" y="90" class="card-title">Modern Design System</text>
    <text x="20" y="115" class="card-desc">Accessible, accessible React &amp; Tailwind CSS component library with full light/dark mode support.</text>

    <g transform="translate(20, 185)">
      <rect width="60" height="24" rx="12" fill="#ecfdf5" />
      <text x="12" y="16" class="tag-text" fill="#15803d">React</text>
      <rect x="70" width="80" height="24" rx="12" fill="#ecfdf5" />
      <text x="80" y="16" class="tag-text" fill="#15803d">Tailwind</text>
      <rect x="160" width="80" height="24" rx="12" fill="#ecfdf5" />
      <text x="170" y="16" class="tag-text" fill="#15803d">Storybook</text>
    </g>
  </g>
</svg>
